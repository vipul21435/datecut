[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datecut"
version = "0.1.0"
description = "Compare a system's benchmark success before and after a cutoff date, adjusted for item difficulty and source."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vipul Raj Jha" }]
keywords = ["evaluation", "benchmark", "contamination", "cutoff", "statistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "statsmodels>=0.14"]
plot = ["matplotlib>=3.6"]

[project.scripts]
datecut = "datecut.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/datecut"

[tool.hatch.build.targets.wheel]
packages = ["src/datecut"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
